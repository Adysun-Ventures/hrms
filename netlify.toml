[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"

# Single-page app: every non-file URL serves index.html (API paths are matched by the functions first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
